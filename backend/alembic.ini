# ==============================================================================
# SANGRAM AI — ALEMBIC DATABASE MIGRATION CONFIGURATION
# Scaffold created by Developer 1; actual domain migrations owned by Developer 2.
# ==============================================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Prepend sys.path with current directory
prepend_sys_path = .

# Timezone for generated migrations
timezone = UTC

# Max length of characters for slug
truncate_slug_length = 40

# Database URL is overridden dynamically by alembic/env.py via app.core.config.get_settings()
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/sangram_ai

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
